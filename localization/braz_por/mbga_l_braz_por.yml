 rule_mbga_province_access: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Exigências de províncias"
 setting_mbga_province_access_bordering: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_bordering_desc Apenas fronteiriças#!#!"
 setting_mbga_province_access_bordering_desc: "Uma província só pode ser exigida onde toca terra que você já possui, de modo que desmembrar um estado se faz da borda para dentro."
 setting_mbga_province_access_anywhere: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_anywhere_desc #high Em qualquer ponto do estado#!#!#!"
 setting_mbga_province_access_anywhere_desc: "Qualquer província de um estado pode ser exigida, esteja onde estiver. Mais rápido, e dispensa o trabalho de descobrir o que faz fronteira com o quê."

 rule_mbga_province_tool: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Ferramenta de transferência de províncias"
 setting_mbga_province_tool_off: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_off_desc Desligada#!#!"
 setting_mbga_province_tool_off_desc: "Sem ferramenta. As províncias mudam de mãos pela guerra, como o jogo prevê."
 setting_mbga_province_tool_diplomatic: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_diplomatic_desc #high Ação diplomática#!#!#!"
 setting_mbga_province_tool_diplomatic_desc: "Acrescenta uma ação à tela de diplomacia. Escolha um país, escolha um dos estados dele e clique nas províncias que quiser, direto no mapa."
 setting_mbga_province_tool_debug: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_debug_desc #high Painel de depuração#!#!#!"
 setting_mbga_province_tool_debug_desc: "Um painel de depuração: lista de países, lista de estados, linhas de províncias e contadores. Para ver o que o mod faz, não para jogar."

 # Esta opção é para mods que redesenham o mapa e não trazem tabela. Em qualquer mapa para o qual
 # o mod tenha tabela, nada é escaneado e nenhuma das três faz coisa alguma.
 rule_mbga_scan_budget: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Varredura de províncias"
 setting_mbga_scan_budget_low: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_low_desc Esperas curtas#!#!"
 setting_mbga_scan_budget_low_desc: "#high Não afeta o mapa do jogo base.#!\n\nSó os estados pequenos são resolvidos no momento em que abrem. Os maiores abrem de imediato e vão se resolvendo conforme você clica."
 setting_mbga_scan_budget_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_standard_desc #high Equilibrado#!#!#!"
 setting_mbga_scan_budget_standard_desc: "#high Não afeta o mapa do jogo base.#!\n\nA maioria dos estados é resolvida ao abrir; os maiores ficam para se resolver conforme são usados."
 setting_mbga_scan_budget_high: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_high_desc #high Menos interrupções#!#!#!"
 setting_mbga_scan_budget_high_desc: "#high Não afeta o mapa do jogo base.#!\n\nQuase todo estado é resolvido ao abrir, de modo que clicar nunca para para pensar. Um estado grande pode demorar um pouco para abrir."

 MBGA_ACTION_EFFECT_TT: "Abre no mapa o estado escolhido, onde você toma as províncias dele uma a uma. Nada muda de mãos até você clicar."
 rule_mbga_ai_demands: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Exigências da IA"
 setting_mbga_ai_demands_blocked: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_blocked_desc #high Apenas jogadores#!#!#!"
 setting_mbga_ai_demands_blocked_desc: "Só você pode exigir províncias. Uma IA não sabe traçar uma fronteira à mão, então este objetivo de guerra não é oferecido a ela."
 setting_mbga_ai_demands_allowed: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_allowed_desc Make BORDERGORE Great Again#!#!"
 setting_mbga_ai_demands_allowed_desc: "Uma IA também pode tomar este objetivo de guerra. Ela toma as províncias que fazem fronteira com a própria terra e avança para dentro; até onde e com que formato, quem decide são os traços do governante dela. Paga pelo que tomou.\n\n#red Com uma conversão total sem módulo de compatibilidade, é preciso contar com o jogo travando a cada paz da IA: sem uma tabela para o mapa, cada fronteira traçada por uma IA precisa ser calculada província por província.#!"

 mbga_settlement.1.t: "A comissão de fronteiras"
 mbga_settlement.1.d_war: "Os canhões se calaram, e o estado de [SCOPE.sState('mbga_settle_state').GetName] é nosso para repartir. Numa sala bem longe dali, escreventes desenrolam um mapa da província e aguardam sua palavra: quais vales tomar, quais passos, que trecho de costa."
 mbga_settlement.1.d_conceded: "Contaram os exércitos já em marcha e concluíram que o estado de [SCOPE.sState('mbga_settle_state').GetName] seria a perda mais barata. A questão se resolve sem uma única batalha, e numa sala bem longe dali escreventes desenrolam um mapa da província e aguardam sua palavra: quais vales tomar, quais passos, que trecho de costa."
 mbga_settlement.1.d_granted: "A exigência saiu pela manhã e a resposta voltou antes que alguém tivesse tempo de mobilizar: o estado de [SCOPE.sState('mbga_settle_state').GetName] é seu, e nenhum regimento se moveu. Numa sala bem longe dali, escreventes desenrolam um mapa da província e aguardam sua palavra: quais vales tomar, quais passos, que trecho de costa."
 mbga_settlement.1.f_war: "Uma guerra se ganha em campo e se resolve no papel. Cada linha que você traçar aqui será a fronteira de alguém por uma geração, e cada uma que deixar torta será a mágoa de alguém."
 mbga_settlement.1.f_conceded: "Uma fronteira traçada à sombra de um exército não custa vida alguma e não compra gratidão alguma. Cada linha deixada torta será lembrada como o preço de uma ameaça que funcionou."
 mbga_settlement.1.f_granted: "Aqui não se tomou nada que não tenha sido entregue, e essa é daquelas frases que os homens repetem por uma geração e acreditam por cerca de um ano. Trace com cuidado: fronteira cedida é a mais fácil de todas de se exigir de volta."
 mbga_settlement.1.a: "Às pranchetas!\n\n#red (Pause o jogo antes de começar, senão alguma coisa pode quebrar.)#!"

 # Os três países descartáveis são anexados dentro de uma mesma cadeia de efeitos e ninguém os vê,
 # mas tudo o que tocam guarda o nome deles: uma formação levantada numa província enquanto o
 # mensageiro a detinha continua com o nome dele. Nomeados para que o que sobra se leia como enfeite.
 MBG: "Ocupação"
 MBG_ADJ: "de ocupação"
 MBH: "Ocupação"
 MBH_ADJ: "de ocupação"
 MBT: "Conquista"
 MBT_ADJ: "de conquista"

 mbga_probe_culture: "Ocupação"
