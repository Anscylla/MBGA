 mbga_take_provinces_action_action_notification_name: "[INITIATOR_COUNTRY.GetName] toma províncias"
 mbga_take_provinces_action_action_notification_desc: "[INITIATOR_COUNTRY.GetName] tomou províncias nossas, e a fronteira agora passa por onde os agrimensores deles dizem."

 mbga_settlement.2.t: "Território anexado"
 mbga_settlement.2.d: "O país [SCOPE.sCountry('mbga_settle_winner').GetName] anexou território no estado de [SCOPE.sStateRegion('mbga_settle_region_scope').GetName]. Os agrimensores deles estavam em campo antes de a tinta secar, e a linha nova passa por onde eles dizem.\n\nA tomada lhes custou #v [SCOPE.sCountry('mbga_settle_winner').MakeScope.Var('mbga_settle_told').GetValue|1]#! de [concept_infamy]."
 mbga_settlement.2.f: "Em algum lugar um escrevente redesenha um mapa, e em outro uma família descobre que acordou em outro país."
 mbga_settlement.2.a: "Não esqueceremos disso."

