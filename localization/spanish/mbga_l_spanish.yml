 MBG_ADJ: "de ocupación"
 MBH: "Ocupación"
 MBH_ADJ: "de ocupación"
 MBT: "Conquista"
 MBT_ADJ: "de conquista"

 mbga_probe_culture: "Ocupación"
 mbga_name_courier: "Correo"
 mbga_name_probe: "Sonda"
 mbga_take_provinces_action_action_notification_name: "[INITIATOR_COUNTRY.GetName] toma provincias"
 mbga_take_provinces_action_action_notification_desc: "[INITIATOR_COUNTRY.GetName] nos ha tomado provincias, y la frontera pasa ahora por donde dicen sus agrimensores."

 mbga_settlement.2.t: "Territorio anexionado"
 mbga_settlement.2.d: "El país [SCOPE.sCountry('mbga_settle_winner').GetName] se ha anexionado territorio en el estado de [SCOPE.sStateRegion('mbga_settle_region_scope').GetName]. Sus agrimensores estaban sobre el terreno antes de que se secara la tinta, y la nueva línea pasa por donde ellos dicen.\n\nLa toma les ha costado #v [SCOPE.sCountry('mbga_settle_winner').MakeScope.Var('mbga_settle_told').GetValue|1]#! de [concept_infamy]."
 mbga_settlement.2.f: "En algún sitio un oficinista redibuja un mapa, y en otro una familia descubre que ha amanecido en otro país."
 mbga_settlement.2.a: "No lo olvidaremos."

