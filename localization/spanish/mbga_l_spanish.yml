 MBGA_BAR_TITLE: "[Country.MakeScope.Var('mbga_active_state').GetState.GetName]"
 MBGA_BAR_TITLE_TOOLTIP: "#header Trazar la frontera#!\n\nCada provincia del estado, una por fila, sobre una imagen de su propio terreno.\n\n#v Un brillo dorado#! señala tierra de primera. Cuenta cinco veces más que una provincia corriente para la parte de la región que posee este estado, y de esa parte salen su tierra cultivable y sus límites de recursos.\n\n#v Un brillo rojo#! señala terreno intransitable.\n\nLa marca junto a la fila dice qué se puede hacer con ella: tomada, fuera de alcance o libre."
