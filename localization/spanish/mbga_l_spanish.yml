 rule_mbga_province_access: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Reclamaciones de provincias"
 setting_mbga_province_access_bordering: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_bordering_desc Solo fronterizas#!#!"
 setting_mbga_province_access_bordering_desc: "Una provincia solo puede exigirse allí donde toca tierra ya poseída, de modo que un estado se desmiembra desde su borde hacia dentro."
 setting_mbga_province_access_anywhere: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_anywhere_desc #high En cualquier punto del estado#!#!#!"
 setting_mbga_province_access_anywhere_desc: "Puede exigirse cualquier provincia de un estado, esté donde esté. Más rápido, y ahorra el trabajo de averiguar qué linda con qué."

 rule_mbga_province_tool: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Herramienta de traspaso de provincias"
 setting_mbga_province_tool_off: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_off_desc Desactivada#!#!"
 setting_mbga_province_tool_off_desc: "Sin herramienta. Las provincias cambian de manos mediante la guerra, como el juego dispone."
 setting_mbga_province_tool_diplomatic: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_diplomatic_desc #high Acción diplomática#!#!#!"
 setting_mbga_province_tool_diplomatic_desc: "Añade una acción a la pantalla de diplomacia. Se elige un país, se elige uno de sus estados y luego se pulsan en el mapa las provincias deseadas."
 setting_mbga_province_tool_debug: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_debug_desc #high Panel de depuración#!#!#!"
 setting_mbga_province_tool_debug_desc: "Un panel de depuración: lista de países, lista de estados, filas de provincias y contadores. Para ver qué hace el mod, no para jugar."

 # Este ajuste es para mods que redibujan el mapa y no traen tabla. En cualquier mapa del que
 # el mod tenga tabla, nunca se escanea nada y ninguna de las tres hace nada.
 rule_mbga_scan_budget: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Escaneo de provincias"
 setting_mbga_scan_budget_low: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_low_desc Esperas cortas#!#!"
 setting_mbga_scan_budget_low_desc: "#high No afecta al mapa del juego base.#!\n\nSolo los estados pequeños se resuelven al abrirse. Los mayores se abren de inmediato y se van resolviendo conforme se pulsa."
 setting_mbga_scan_budget_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_standard_desc #high Equilibrado#!#!#!"
 setting_mbga_scan_budget_standard_desc: "#high No afecta al mapa del juego base.#!\n\nLa mayoría de los estados se resuelven al abrirse; los mayores se dejan para que se resuelvan a medida que se usan."
 setting_mbga_scan_budget_high: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_high_desc #high Menos interrupciones#!#!#!"
 setting_mbga_scan_budget_high_desc: "#high No afecta al mapa del juego base.#!\n\nCasi todos los estados se resuelven al abrirse, de modo que pulsar nunca se detiene a pensar. Un estado grande puede tardar un rato en abrirse."

 MBGA_ACTION_EFFECT_TT: "Abre en el mapa el estado elegido, donde sus provincias se toman de una en una. Nada cambia de manos hasta que se pulsa."
 rule_mbga_ai_demands: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Reclamaciones de la IA"
 setting_mbga_ai_demands_blocked: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_blocked_desc #high Solo jugadores#!#!#!"
 setting_mbga_ai_demands_blocked_desc: "Solo el jugador puede exigir provincias. Una IA no sabe trazar una frontera a mano, así que no se le ofrece este objetivo de guerra."
 setting_mbga_ai_demands_allowed: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_allowed_desc Make BORDERGORE Great Again#!#!"
 setting_mbga_ai_demands_allowed_desc: "Una IA también puede tomar este objetivo de guerra. Toma las provincias que lindan con su propia tierra y avanza hacia dentro; hasta dónde y con qué forma lo deciden los rasgos de su gobernante. Paga por lo que tomó.\n\n#red Con una conversión total sin módulo de compatibilidad, hay que contar con que el juego se congele en cada paz de la IA: sin una tabla para el mapa, cada frontera que traza una IA debe calcularse provincia por provincia.#!"

 mbga_settlement.1.t: "La comisión de fronteras"
 mbga_settlement.1.d_war: "Los cañones callan y el estado de [SCOPE.sState('mbga_settle_state').GetName] es nuestro para repartirlo. En una sala muy lejos de allí, unos oficinistas despliegan un mapa de la provincia y aguardan una orden: qué valles tomar, qué pasos, qué tramo de costa."
 mbga_settlement.1.d_conceded: "Contaron los ejércitos que ya marchaban y decidieron que el estado de [SCOPE.sState('mbga_settle_state').GetName] era la pérdida más barata. El asunto se zanja sin una sola batalla, y en una sala muy lejos de allí unos oficinistas despliegan un mapa de la provincia y aguardan una orden: qué valles tomar, qué pasos, qué tramo de costa."
 mbga_settlement.1.d_granted: "La exigencia salió por la mañana y la respuesta volvió antes de que nadie tuviera tiempo de movilizarse: el estado de [SCOPE.sState('mbga_settle_state').GetName] es nuestro, y no se movió ni un regimiento. En una sala muy lejos de allí, unos oficinistas despliegan un mapa de la provincia y aguardan una orden: qué valles tomar, qué pasos, qué tramo de costa."
 mbga_settlement.1.f_war: "Una guerra se gana en el campo y se zanja sobre el papel. Cada línea que se trace aquí será la frontera de alguien durante una generación, y cada una que quede torcida será el agravio de alguien."
 mbga_settlement.1.f_conceded: "Una frontera trazada a la sombra de un ejército no cuesta ninguna vida ni compra ninguna gratitud. Cada línea que quede torcida se recordará como el precio de una amenaza que funcionó."
 mbga_settlement.1.f_granted: "Aquí no se tomó nada que no fuera entregado, que es de esas frases que los hombres repiten durante una generación y creen alrededor de un año. Una frontera cedida es la más fácil de todas de volver a reclamar, motivo suficiente para trazarla con cuidado."
 mbga_settlement.1.a: "¡A los tableros de dibujo!\n\n#red (Conviene pausar el juego antes de empezar, o algo puede romperse.)#!"

 # Los tres países desechables se anexionan dentro de una misma cadena de efectos y nadie los ve,
 # pero todo lo que tocan conserva su nombre: una formación levantada en una provincia mientras el
 # correo la tenía sigue llamándose por él. Nombrados para que lo que quede se lea como ambientación.
