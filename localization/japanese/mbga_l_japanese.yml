 MBGA_STATS_TOUCH: "touching pairs #v [Country.MakeScope.Var('mbga_pairs_found').GetValue|0]#!"
 MBGA_STATS_HOME: "touch home #v [Country.MakeScope.Var('mbga_touch_home_count').GetValue|0]#!"
