 MBGA_BAR_TAKEN: "Taken #v [Country.MakeScope.Var('mbga_taken_count').GetValue|0]#! of #v [Country.MakeScope.Var('mbga_candidate_count').GetValue|0]#!"
 MBGA_BAR_DONE: "Done"
 MBGA_BAR_TITLE: "[Country.MakeScope.Var('mbga_active_state').GetState.GetName]"
 MBGA_BAR_TITLE_TOOLTIP: "#header Drawing the border#!\n\nEvery province of the state, one to a row, standing on a picture of its own ground.\n\n#v A gold glow#! marks prime land. It counts five times an ordinary province towards this state's share of its region, and that share is what its arable land and its resource caps are worked out from.\n\n#v A red glow#! marks ground nobody can march through.\n\nThe mark beside a row says what can be done with it: taken, out of reach, or free to take."
 MBGA_BAR_LIST: "[SelectLocalization(GetScriptedGui('mbga_province_list_shown').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'MBGA_BAR_LIST_HIDE', 'MBGA_BAR_LIST_SHOW')]"
