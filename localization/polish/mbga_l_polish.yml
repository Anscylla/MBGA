 rule_mbga_province_access: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Żądania prowincji"
 setting_mbga_province_access_bordering: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_bordering_desc Tylko przylegające#!#!"
 setting_mbga_province_access_bordering_desc: "Prowincji można zażądać tylko tam, gdzie styka się z już posiadaną ziemią, więc obszar administracyjny rozbiera się od skraju w głąb."
 setting_mbga_province_access_anywhere: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_anywhere_desc #high Dowolne w stanie#!#!#!"
 setting_mbga_province_access_anywhere_desc: "Zażądać można każdej prowincji obszaru administracyjnego, niezależnie od tego, gdzie leży. Szybciej, bo odpada ustalanie, co z czym sąsiaduje."

 rule_mbga_province_tool: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Narzędzie przekazywania prowincji"
 setting_mbga_province_tool_off: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_off_desc Wyłączone#!#!"
 setting_mbga_province_tool_off_desc: "Bez narzędzia. Prowincje zmieniają właściciela w wyniku wojny, tak jak przewiduje gra."
 setting_mbga_province_tool_diplomatic: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_diplomatic_desc #high Akcja dyplomatyczna#!#!#!"
 setting_mbga_province_tool_diplomatic_desc: "Dodaje akcję do ekranu dyplomacji. Wybiera się kraj, potem jeden z jego obszarów administracyjnych, a na koniec klika na mapie wybrane prowincje."
 setting_mbga_province_tool_debug: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_debug_desc #high Panel diagnostyczny#!#!#!"
 setting_mbga_province_tool_debug_desc: "Panel diagnostyczny: lista krajów, lista obszarów, wiersze prowincji i liczniki. Do podglądu tego, co mod robi, nie do gry."

 # Ta opcja dotyczy modów przerysowujących mapę, które nie mają wygenerowanej tablicy. Na każdej
 # mapie, dla której tablica istnieje, nic nie jest skanowane i żadna z trzech nie robi nic.
 rule_mbga_scan_budget: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Skanowanie prowincji"
 setting_mbga_scan_budget_low: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_low_desc Krótkie oczekiwanie#!#!"
 setting_mbga_scan_budget_low_desc: "#high Nie ma wpływu na mapę podstawowej gry.#!\n\nTylko małe obszary administracyjne są skanowane w chwili otwarcia. Większe otwierają się od razu i są skanowane w miarę klikania."
 setting_mbga_scan_budget_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_standard_desc #high Zrównoważone#!#!#!"
 setting_mbga_scan_budget_standard_desc: "#high Nie ma wpływu na mapę podstawowej gry.#!\n\nWiększość obszarów jest skanowana przy otwarciu; największe dopiero w miarę używania."
 setting_mbga_scan_budget_high: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_high_desc #high Najmniej przerw#!#!#!"
 setting_mbga_scan_budget_high_desc: "#high Nie ma wpływu na mapę podstawowej gry.#!\n\nNiemal każdy obszar jest skanowany przy otwarciu, więc klikanie nigdy się nie zatrzymuje. Duży obszar może się otwierać dłuższą chwilę."

 MBGA_ACTION_EFFECT_TT: "Otwiera wybrany obszar administracyjny na mapie, gdzie jego prowincje bierze się pojedynczo. Nic nie zmienia właściciela, dopóki się nie kliknie."
 rule_mbga_ai_demands: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Żądania prowincji przez SI"
 setting_mbga_ai_demands_blocked: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_blocked_desc #high Tylko gracze#!#!#!"
 setting_mbga_ai_demands_blocked_desc: "Prowincji może żądać tylko gracz. SI nie narysuje granicy ręcznie, więc ten cel wojenny nie jest jej proponowany."
 setting_mbga_ai_demands_allowed: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_allowed_desc Make BORDERGORE Great Again#!#!"
 setting_mbga_ai_demands_allowed_desc: "SI również może wziąć ten cel wojenny. Bierze prowincje przylegające do własnej ziemi i idzie w głąb - jak daleko i jakim kształtem, o tym decydują cechy jej władcy - i płaci za to, co wzięła.\n\n#red Przy modzie total overhaul bez modułu zgodności trzeba się liczyć z zawieszeniem gry przy każdym pokoju SI: bez tablicy dla danej mapy każda granica rysowana przez SI musi być wyliczana prowincja po prowincji.#!"

 mbga_settlement.1.t: "Komisja graniczna"
 mbga_settlement.1.d_war: "Działa ucichły, a obszar administracyjny [SCOPE.sState('mbga_settle_state').GetName] jest nasz do podziału. W sali daleko stamtąd urzędnicy rozwijają mapę prowincji i czekają na decyzję: które doliny wziąć, które przełęcze, który odcinek wybrzeża."
 mbga_settlement.1.d_conceded: "Policzyli maszerujące już armie i uznali, że obszar administracyjny [SCOPE.sState('mbga_settle_state').GetName] będzie tańszą stratą. Posunięcie dyplomatyczne kończy się bez jednej bitwy, a w sali daleko stamtąd urzędnicy rozwijają mapę prowincji i czekają na decyzję: które doliny wziąć, które przełęcze, który odcinek wybrzeża."
 mbga_settlement.1.d_granted: "Żądanie poszło rano, a odpowiedź wróciła, zanim ktokolwiek zdążył ogłosić mobilizację: obszar administracyjny [SCOPE.sState('mbga_settle_state').GetName] jest nasz, i nie ruszył się ani jeden pułk. W sali daleko stamtąd urzędnicy rozwijają mapę prowincji i czekają na decyzję: które doliny wziąć, które przełęcze, który odcinek wybrzeża."
 mbga_settlement.1.f_war: "Wojnę wygrywa się na polu bitwy, a kończy na papierze. Każda linia poprowadzona tutaj będzie czyjąś granicą przez pokolenie, a każda zostawiona krzywo - czyjąś urazą."
 mbga_settlement.1.f_conceded: "Granica wytyczona w cieniu armii nie kosztuje ani jednego życia i nie zjednuje niczyjej wdzięczności. Każda linia zostawiona krzywo zostanie zapamiętana jako cena groźby, która podziałała."
 mbga_settlement.1.f_granted: "Niczego tu nie zabrano, wszystko oddano dobrowolnie - a to jest zdanie, które ludzie powtarzają przez pokolenie i wierzą w nie mniej więcej rok. O granicę, którą oddano bez walki, najłatwiej się potem upomnieć - tym uważniej trzeba ją rysować."
 mbga_settlement.1.a: "Do desek kreślarskich!\n\n#red (Warto zatrzymać grę przed rozpoczęciem, inaczej może się coś zepsuć.)#!"

 # Trzy kraje jednorazowe są wchłaniane w obrębie jednego łańcucha efektów i nikt ich nie widzi,
 # ale wszystko, czego dotkną, zachowuje ich nazwę: formacja wystawiona w prowincji, którą trzymał
 # kurier, nadal się tak nazywa. Nazwane tak, żeby to, co zostanie, czytało się jak smaczek.
 MBG: "Okupacja"
 MBG_ADJ: "Okupacyjna"
 MBH: "Okupacja"
 MBH_ADJ: "Okupacyjna"
 MBT: "Podbój"
 MBT_ADJ: "Podbita"

 mbga_settlement.2.t: "Terytorium zaanektowane"
 mbga_settlement.2.d: "Kraj [SCOPE.sCountry('mbga_settle_winner').GetName] anektuje terytorium w obszarze administracyjnym [SCOPE.sStateRegion('mbga_settle_region_scope').GetName]. Ich geodeci byli na miejscu, zanim atrament wysechł, a nowa linia biegnie tam, gdzie oni każą.\n\nTo zagarnięcie kosztowało ich #v [SCOPE.sCountry('mbga_settle_winner').MakeScope.Var('mbga_settle_told').GetValue|1]#! [Concept('concept_infamy', 'niesławy')]."
 mbga_settlement.2.f: "Gdzieś urzędnik przerysowuje mapę, a gdzie indziej rodzina dowiaduje się, że obudziła się w innym kraju."
 mbga_settlement.2.a: "Nie zapomnimy tego."

