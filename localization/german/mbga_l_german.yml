 rule_mbga_province_access: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Provinzforderungen"
 setting_mbga_province_access_bordering: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_bordering_desc Nur angrenzende#!#!"
 setting_mbga_province_access_bordering_desc: "Eine Provinz kann nur dort gefordert werden, wo sie an bereits gehaltenes Land grenzt. Ein Staat wird daher vom Rand her nach innen zerlegt."
 setting_mbga_province_access_anywhere: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_anywhere_desc #high Überall im Staat#!#!#!"
 setting_mbga_province_access_anywhere_desc: "Jede Provinz eines Staates kann gefordert werden, gleich wo sie liegt. Schneller, denn es muss nicht ermittelt werden, was an was grenzt."

 rule_mbga_province_tool: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Werkzeug zur Provinzübergabe"
 setting_mbga_province_tool_off: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_off_desc Aus#!#!"
 setting_mbga_province_tool_off_desc: "Kein Werkzeug. Provinzen wechseln den Besitzer durch Krieg, wie vom Spiel vorgesehen."
 setting_mbga_province_tool_diplomatic: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_diplomatic_desc #high Diplomatische Aktion#!#!#!"
 setting_mbga_province_tool_diplomatic_desc: "Fügt dem Diplomatiebildschirm eine Aktion hinzu. Ein Land wählen, einen seiner Staaten wählen und dann auf der Karte die gewünschten Provinzen anklicken."
 setting_mbga_province_tool_debug: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_debug_desc #high Debug-Panel#!#!#!"
 setting_mbga_province_tool_debug_desc: "Ein Debug-Panel: Länderliste, Staatenliste, Provinzzeilen und Zähler. Um zu sehen, was der Mod tut, nicht zum Spielen."

 # Diese Einstellung gilt Mods, die die Karte neu zeichnen und keine Tabelle mitliefern. Auf jeder
 # Karte, für die eine Tabelle vorliegt, wird nie gescannt und keine der drei bewirkt etwas.
 rule_mbga_scan_budget: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Provinzabtastung"
 setting_mbga_scan_budget_low: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_low_desc Kurze Wartezeiten#!#!"
 setting_mbga_scan_budget_low_desc: "#high Ohne Wirkung auf die Karte des Grundspiels.#!\n\nNur kleine Staaten werden beim Öffnen vollständig ausgewertet. Größere öffnen sofort und werden während der Auswahl nach und nach ausgewertet."
 setting_mbga_scan_budget_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_standard_desc #high Ausgewogen#!#!#!"
 setting_mbga_scan_budget_standard_desc: "#high Ohne Wirkung auf die Karte des Grundspiels.#!\n\nDie meisten Staaten werden beim Öffnen ausgewertet; die größten erst während der Auswahl."
 setting_mbga_scan_budget_high: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_high_desc #high Wenigste Unterbrechungen#!#!#!"
 setting_mbga_scan_budget_high_desc: "#high Ohne Wirkung auf die Karte des Grundspiels.#!\n\nNahezu jeder Staat wird beim Öffnen ausgewertet, sodass das Klicken nie stockt. Ein großer Staat kann eine Weile zum Öffnen brauchen."

 MBGA_ACTION_EFFECT_TT: "Öffnet den gewählten Staat auf der Karte, wo sich seine Provinzen einzeln nehmen lassen. Nichts wechselt den Besitzer, bevor geklickt wurde."
 rule_mbga_ai_demands: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! KI-Provinzforderungen"
 setting_mbga_ai_demands_blocked: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_blocked_desc #high Nur Spieler#!#!#!"
 setting_mbga_ai_demands_blocked_desc: "Nur der Spieler kann Provinzen fordern. Eine KI kann keine Grenze von Hand ziehen, also wird ihr dieses Kriegsziel nicht angeboten."
 setting_mbga_ai_demands_allowed: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_allowed_desc Make BORDERGORE Great Again#!#!"
 setting_mbga_ai_demands_allowed_desc: "Auch eine KI kann dieses Kriegsziel wählen. Sie nimmt die Provinzen, die an ihr eigenes Land grenzen, und arbeitet sich nach innen vor; wie tief und in welcher Form, bestimmen die Eigenschaften ihres Herrschers. Für das Genommene zahlt sie.\n\n#red Bei einer Totalkonversion ohne Kompatibilitätsmodul ist bei jedem Frieden der KI mit einem Einfrieren des Spiels zu rechnen: ohne Tabelle für die Karte muss jede von einer KI gezogene Grenze Provinz für Provinz ermittelt werden.#!"

 mbga_settlement.1.t: "Die Grenzkommission"
 mbga_settlement.1.d_war: "Die Geschütze schweigen, und der Staat [SCOPE.sState('mbga_settle_state').GetName] gehört uns zum Teilen. In einem Saal weit davon entfernt rollen Schreiber eine Karte der Provinz aus und warten auf eine Entscheidung: welche Täler zu nehmen sind, welche Pässe, welcher Küstenstreifen."
 mbga_settlement.1.d_conceded: "Sie zählten die bereits marschierenden Heere und befanden, der Staat [SCOPE.sState('mbga_settle_state').GetName] sei der billigere Verlust. Die Sache ist ohne eine einzige Schlacht geregelt, und in einem Saal weit davon entfernt rollen Schreiber eine Karte der Provinz aus und warten auf eine Entscheidung: welche Täler zu nehmen sind, welche Pässe, welcher Küstenstreifen."
 mbga_settlement.1.d_granted: "Die Forderung ging am Morgen hinaus, und die Antwort kam zurück, ehe irgendwer Zeit zum Mobilmachen hatte: der Staat [SCOPE.sState('mbga_settle_state').GetName] gehört uns, und kein Regiment hat sich gerührt. In einem Saal weit davon entfernt rollen Schreiber eine Karte der Provinz aus und warten auf eine Entscheidung: welche Täler zu nehmen sind, welche Pässe, welcher Küstenstreifen."
 mbga_settlement.1.f_war: "Ein Krieg wird im Feld gewonnen und auf dem Papier geregelt. Jede Linie, die hier gezogen wird, ist für eine Generation jemandes Grenze, und jede, die krumm bleibt, jemandes Groll."
 mbga_settlement.1.f_conceded: "Eine im Schatten eines Heeres gezogene Grenze kostet kein Leben und kauft keine Dankbarkeit. Jede krumm gelassene Linie wird als Preis einer Drohung in Erinnerung bleiben, die gewirkt hat."
 mbga_settlement.1.f_granted: "Hier wurde nichts genommen, was nicht übergeben worden wäre - ein Satz, den Menschen eine Generation lang wiederholen und ungefähr ein Jahr lang glauben. Eine hergegebene Grenze lässt sich von allen am leichtesten zurückfordern - Grund genug, sorgfältig zu ziehen."
 mbga_settlement.1.a: "An die Reißbretter!\n\n#red (Vor dem Beginn das Spiel pausieren, sonst geht womöglich etwas kaputt.)#!"

 # Die drei Wegwerfländer werden innerhalb einer Effektkette annektiert und bekommt niemand zu
 # Gesicht, doch alles, was sie berühren, behält ihren Namen: ein Verband, der in einer Provinz
 # aufgestellt wurde, während der Kurier sie hielt, heißt weiterhin nach ihm. So benannt, dass sich
 # das Übriggebliebene wie Beiwerk liest.
