 mbga_take_provinces_action_action_notification_desc: "[INITIATOR_COUNTRY.GetName] hat uns Provinzen genommen, und die Grenze verläuft nun dort, wo deren Landvermesser es sagen."

 mbga_settlement.2.t: "Gebiet annektiert"
 mbga_settlement.2.d: "Das Land [SCOPE.sCountry('mbga_settle_winner').GetName] hat Gebiet im Staat [SCOPE.sStateRegion('mbga_settle_region_scope').GetName] annektiert. Ihre Landvermesser waren vor Ort, ehe die Tinte trocken war, und die neue Linie verläuft dort, wo sie es sagen.\n\nDer Zugriff hat sie #v [SCOPE.sCountry('mbga_settle_winner').MakeScope.Var('mbga_settle_told').GetValue|1]#! [concept_infamy] gekostet."
 mbga_settlement.2.f: "Irgendwo zeichnet ein Schreiber eine Karte neu, und anderswo erfährt eine Familie, dass sie in einem anderen Land aufgewacht ist."
 mbga_settlement.2.a: "Das werden wir nicht vergessen."

