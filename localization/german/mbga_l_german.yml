 MBGA_BAR_DONE: "Fertig"
 MBGA_BAR_TITLE: "[Country.MakeScope.Var('mbga_active_state').GetState.GetName]"
 MBGA_BAR_TITLE_TOOLTIP: "#header Die Grenze ziehen#!\n\nJede Provinz des Staates, eine je Zeile, auf einem Bild ihres eigenen Geländes.\n\n#v Ein goldenes Leuchten#! kennzeichnet Spitzenland. Es zählt fünfmal so viel wie eine gewöhnliche Provinz für den Anteil dieses Staates an seiner Region, und aus diesem Anteil ergeben sich Ackerland und Rohstoffgrenzen.\n\n#v Ein rotes Leuchten#! kennzeichnet unpassierbares Gelände.\n\nDas Zeichen neben der Zeile sagt, was möglich ist: genommen, außer Reichweite oder frei."
 MBGA_BAR_LIST: "[SelectLocalization(GetScriptedGui('mbga_province_list_shown').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'MBGA_BAR_LIST_HIDE', 'MBGA_BAR_LIST_SHOW')]"
 MBGA_BAR_LIST_SHOW: "Provinzliste"
 MBGA_BAR_LIST_HIDE: "Provinzen ausblenden"
 MBGA_ALREADY_OPEN: "Ein Staat ist bereits offen. Diesen zuerst abschließen."
 mbga_settlement.1.d_treaty: "Der Vertrag ist unterzeichnet und das Geld hat den Besitzer gewechselt: [SCOPE.sState('mbga_settle_state').GetName] steht unseren Vermessern offen, und kein Regiment hat sich bewegt. Jede Klausel wurde vom Verkäufer gegengezeichnet. In einem fernen Saal rollen Schreiber eine Karte der Provinz aus und warten auf Ihr Wort: welche Täler, welche Pässe, welcher Küstenstreifen."
 mbga_settlement.1.f_treaty: "Gekauft und bezahlt. Zu streiten bleibt nur noch, wo genau die Linie verläuft."
 mbga_settlement.1.b: "#red Unser Land grenzt nicht an [SCOPE.sState('mbga_settle_state').GetName]. Unsere Vermesser haben hier nichts, wovon aus sie arbeiten könnten.#!\n\nWarten andere Kommissionen, so erledigen Sie diese zuerst - dort gewonnener Boden kann diesen Staat in Reichweite bringen."
 mbga_settlement.2.d_treaty: "[SCOPE.sCountry('mbga_settle_winner').GetName] hat den Boden in [SCOPE.sStateRegion('mbga_settle_region_scope').GetName] übernommen, der ihm überschrieben wurde. Seine Vermesser standen darauf, ehe die Tinte trocken war, und die neue Linie verläuft, wie der Vertrag es sagt.\n\nDies wurde verkauft, nicht genommen. Die Zahlung liegt bereits in der Schatzkammer, und zu tadeln ist allein die Hand, die unterschrieb."
 mbga_settlement.2.f_treaty: "Irgendwo zeichnet ein Schreiber eine Karte neu, und anderswo erfährt eine Familie, dass sie in einem anderen Land aufgewacht ist - diesmal mit der Unterschrift der eigenen Regierung darunter."
 mbga_province_cession: "Provinzen abtreten"
 mbga_province_cession_desc: ""
 mbga_province_cession_effects_desc: "• Begründet eine Vereinbarung, in der ein [Concept('concept_country', '$concept_countries$')] dem anderen einen Teil eines [concept_state] abtritt, Provinz für Provinz, gezogen sobald der Vertrag in Kraft ist"
 mbga_province_cession_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting] tritt Provinzen eines $concept_state$ an [TARGET_COUNTRY.GetNameNoFormatting] ab"
 mbga_give_provinces_action: "Provinzen übergeben"
 mbga_give_provinces_action_desc: "Wählen Sie einen unserer Staaten und übergeben Sie ihnen dessen Provinzen einzeln, direkt auf der Karte."
 mbga_give_provinces_action_action_notification_name: "[INITIATOR_COUNTRY.GetName] übergibt Provinzen"
 mbga_give_provinces_action_action_notification_desc: "[INITIATOR_COUNTRY.GetName] verschiebt die Grenze zu unseren Gunsten."
 MBGA_GIVE_ACTION_EFFECT_TT: "Öffnet den gewählten Staat auf der Karte, wo Sie seine Provinzen einzeln übergeben. Nichts wechselt den Besitzer, bevor Sie eine anklicken."
 mbga_settlement.3.t: "Gebiet erhalten"
 mbga_settlement.3.d: "[SCOPE.sCountry('mbga_give_giver').GetName] hat uns Boden in [SCOPE.sStateRegion('mbga_give_region').GetName] übergeben. Ihre Vermesser zogen ab, als unsere eintrafen, und die neue Linie verläuft, wo sie sie gezogen haben.\n\nEine Gegenleistung wurde nicht verlangt."
 mbga_settlement.3.f: "Irgendwo zeichnet ein Schreiber eine Karte neu, und anderswo erfährt eine Familie, dass sie nun einer neuen Hauptstadt untersteht."
 mbga_settlement.3.a: "Eine großzügige Geste."
