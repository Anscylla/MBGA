 MBGA_STATS_TOUCH: "paires contiguës #v [Country.MakeScope.Var('mbga_pairs_found').GetValue|0]#!"
 MBGA_STATS_HOME: "touchant nos terres #v [Country.MakeScope.Var('mbga_touch_home_count').GetValue|0]#!"
 MBGA_STATS_TAKEABLE: "prenables maintenant #v [Country.MakeScope.Var('mbga_takeable_count').GetValue|0]#!"
 MBGA_STATS_ORPHANS: "isolées, rendues #v [Country.MakeScope.Var('mbga_orphans_released').GetValue|0]#!"

 MBGA_BAR_TAKEN: "Prises #v [Country.MakeScope.Var('mbga_taken_count').GetValue|0]#! sur #v [Country.MakeScope.Var('mbga_candidate_count').GetValue|0]#!"
 MBGA_BAR_DONE: "Terminé"
 MBGA_BAR_TITLE: "[Country.MakeScope.Var('mbga_active_state').GetState.GetName]"
 MBGA_BAR_TITLE_TOOLTIP: "#header Tracer la frontière#!\n\nChaque province de l'État, une par ligne, sur une image de son propre terrain.\n\n#v Une lueur dorée#! signale une terre de qualité. Elle compte cinq fois plus qu'une province ordinaire dans la part de la région détenue par cet État, et c'est de cette part que découlent ses terres arables et ses gisements.\n\n#v Une lueur rouge#! signale un terrain infranchissable.\n\nLe repère à côté de la ligne indique ce qu'on peut en faire : prise, hors de portée, ou libre."
 MBGA_BAR_LIST: "[SelectLocalization(GetScriptedGui('mbga_province_list_shown').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'MBGA_BAR_LIST_HIDE', 'MBGA_BAR_LIST_SHOW')]"
