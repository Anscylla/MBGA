 MBGA_STATS_SHOW: "Chiffres"
 MBGA_STATS_HIDE: "Masquer les chiffres"

 rule_mbga_province_access: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Revendications de provinces"
 setting_mbga_province_access_bordering: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_bordering_desc Frontalières seulement#!#!"
 setting_mbga_province_access_bordering_desc: "Une province ne peut être exigée que là où elle touche une terre que vous tenez déjà : démembrer un État se fait donc depuis ses bords vers l'intérieur."
 setting_mbga_province_access_anywhere: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_anywhere_desc #high N'importe où dans l'État#!#!#!"
 setting_mbga_province_access_anywhere_desc: "N'importe quelle province d'un État peut être exigée, où qu'elle se trouve. Plus rapide, et il n'y a plus à déterminer quelles provinces se touchent."

 rule_mbga_province_tool: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Outil de transfert de provinces"
 setting_mbga_province_tool_off: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_off_desc Désactivé#!#!"
 setting_mbga_province_tool_off_desc: "Aucun outil. Les provinces changent de mains par la guerre, comme prévu par le jeu."
 setting_mbga_province_tool_diplomatic: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_diplomatic_desc #high Action diplomatique#!#!#!"
 setting_mbga_province_tool_diplomatic_desc: "Ajoute une action à l'écran de diplomatie. Choisissez un pays, choisissez l'un de ses États, puis cliquez sur les provinces voulues directement sur la carte."
 setting_mbga_province_tool_debug: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_debug_desc #high Panneau de débogage#!#!#!"
 setting_mbga_province_tool_debug_desc: "Un panneau de débogage : liste des pays, liste des États, lignes de provinces et compteurs. Pour voir ce que fait le mod, pas pour y jouer."

 # Ce réglage concerne les mods qui redessinent la carte sans fournir de table. Sur toute carte
 # pour laquelle une table existe, rien n'est jamais scanné et aucun des trois ne fait quoi que ce soit.
 rule_mbga_scan_budget: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Balayage des provinces"
 setting_mbga_scan_budget_low: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_low_desc Attentes courtes#!#!"
 setting_mbga_scan_budget_low_desc: "#high Sans effet sur la carte du jeu de base.#!\n\nSeuls les petits États sont analysés au moment de leur ouverture. Les plus grands s'ouvrent aussitôt et s'analysent au fil de vos clics."
 setting_mbga_scan_budget_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_standard_desc #high Équilibré#!#!#!"
 setting_mbga_scan_budget_standard_desc: "#high Sans effet sur la carte du jeu de base.#!\n\nLa plupart des États sont analysés à l'ouverture ; les plus grands sont laissés à s'analyser au fil de leur usage."
 setting_mbga_scan_budget_high: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_high_desc #high Le moins d'interruptions#!#!#!"
 setting_mbga_scan_budget_high_desc: "#high Sans effet sur la carte du jeu de base.#!\n\nPresque tous les États sont analysés à l'ouverture, de sorte que vos clics ne sont jamais interrompus. Un grand État peut mettre un moment à s'ouvrir."

 MBGA_ACTION_EFFECT_TT: "Ouvre l'État choisi sur la carte, où vous prenez ses provinces une à une. Rien ne change de mains tant que vous n'avez pas cliqué."
 rule_mbga_ai_demands: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Revendications de l'IA"
 setting_mbga_ai_demands_blocked: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_blocked_desc #high Joueurs seulement#!#!#!"
 setting_mbga_ai_demands_blocked_desc: "Vous seul pouvez exiger des provinces. Une IA ne sait pas tracer une frontière à la main, aussi cet objectif de guerre ne lui est-il pas proposé."
 setting_mbga_ai_demands_allowed: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_allowed_desc Make BORDERGORE Great Again#!#!"
 setting_mbga_ai_demands_allowed_desc: "Une IA peut également prendre cet objectif de guerre. Elle prend les provinces qui bordent ses propres terres et progresse vers l'intérieur ; la profondeur et la forme de la coupe dépendent des traits de son dirigeant. Elle paie ce qu'elle a pris.\n\n#red Avec une conversion totale sans module de compatibilité, attendez-vous à un gel du jeu à chaque paix de l'IA : faute de table pour la carte, chaque frontière tracée par une IA doit être calculée province par province.#!"

 mbga_settlement.1.t: "La commission des frontières"
 mbga_settlement.1.d_war: "Les canons se sont tus et l'État de [SCOPE.sState('mbga_settle_state').GetName] est à nous, à partager. Dans une salle loin de là, des commis déroulent une carte de la province et attendent votre mot : quelles vallées prendre, quels cols, quelle portion de côte."
 mbga_settlement.1.d_conceded: "Ils ont compté les armées déjà en marche et jugé que l'État de [SCOPE.sState('mbga_settle_state').GetName] serait la perte la moins chère. L'affaire se règle sans une seule bataille, et dans une salle loin de là, des commis déroulent une carte de la province et attendent votre mot : quelles vallées prendre, quels cols, quelle portion de côte."
 mbga_settlement.1.d_granted: "La demande est partie au matin et la réponse est revenue avant que quiconque ait eu le temps de mobiliser : l'État de [SCOPE.sState('mbga_settle_state').GetName] est à vous, et pas un régiment n'a bougé. Dans une salle loin de là, des commis déroulent une carte de la province et attendent votre mot : quelles vallées prendre, quels cols, quelle portion de côte."
 mbga_settlement.1.f_war: "Une guerre se gagne sur le terrain et se règle sur le papier. Chaque trait que vous tirerez ici sera la frontière de quelqu'un pour une génération, et chacun que vous laisserez de travers sera le grief de quelqu'un."
 mbga_settlement.1.f_conceded: "Une frontière tracée à l'ombre d'une armée ne coûte aucune vie et n'achète aucune gratitude. Chaque trait laissé de travers restera dans les mémoires comme le prix d'une menace qui a porté."
 mbga_settlement.1.f_granted: "Rien n'a été pris ici qui n'ait été cédé : voilà le genre de phrase que les hommes répètent pendant une génération et croient à peu près un an. Tracez avec soin, car une frontière donnée est de toutes la plus facile à réclamer."
 mbga_settlement.1.a: "Aux planches à dessin !\n\n#red (Mettez le jeu en pause avant de commencer, sans quoi quelque chose risque de casser.)#!"

 # Les trois pays jetables sont annexés au sein d'une même chaîne d'effets et personne ne les voit,
 # mais tout ce qu'ils touchent garde leur nom : une formation levée dans une province pendant que
 # le passeur la tenait porte encore son nom. Nommés de sorte que ce qui reste se lise comme du décor.
 MBG: "Occupation"
 MBG_ADJ: "d'occupation"
 MBH: "Occupation"
 MBH_ADJ: "d'occupation"
 MBT: "Conquête"
 MBT_ADJ: "de conquête"

 mbga_probe_culture: "Occupation"
 mbga_name_courier: "Courrier"
 mbga_name_probe: "Sonde"
 mbga_take_provinces_action_action_notification_name: "[INITIATOR_COUNTRY.GetName] prend des provinces"
 mbga_take_provinces_action_action_notification_desc: "[INITIATOR_COUNTRY.GetName] nous a pris des provinces, et la frontière passe désormais là où leurs géomètres le disent."

 mbga_settlement.2.t: "Territoire annexé"
 mbga_settlement.2.d: "Le pays [SCOPE.sCountry('mbga_settle_winner').GetName] a annexé un territoire dans l'État de [SCOPE.sStateRegion('mbga_settle_region_scope').GetName]. Leurs géomètres étaient sur place avant que l'encre ne sèche, et la nouvelle ligne passe là où ils le disent.\n\nCette saisie leur a coûté #v [SCOPE.sCountry('mbga_settle_winner').MakeScope.Var('mbga_settle_told').GetValue|1]#! d'[concept_infamy]."
 mbga_settlement.2.f: "Quelque part un commis redessine une carte, et ailleurs une famille apprend qu'elle s'est réveillée dans un autre pays."
 mbga_settlement.2.a: "Nous ne l'oublierons pas."

 mbga_tt: "Ajouté par Make Borders Great Again"
 mbga_take_provinces_action: "Prendre des provinces"
 mbga_take_provinces_action_desc: "Choisissez l'un de leurs États, puis prenez-y directement sur la carte les provinces que vous voulez."
