l_english:
 mbga_run_probes_decision: "MBGA: run capability probes"
 mbga_run_probes_decision_desc: "Writes the results of the province capability probes to the game log."
 MBGA_PANEL_TITLE: "#BOLD Province demands#!"
 MBGA_REFRESH_COUNTRIES: "List countries"
 MBGA_COUNTRY_ROW: "[Scope.GetCountry.GetName]"
 MBGA_PICK_STATE: "Their states:"
 MBGA_STATE_ROW: "[State.GetName]"
 MBGA_GOTO_STATE: "Go to"
 MBGA_SETTLE_INFAMY: "Infamy: #v [Country.MakeScope.Var('mbga_settle_shown').GetValue|1]#!"
 MBGA_TAKEN_COUNT: "Taken: #v [Country.MakeScope.Var('mbga_taken_count').GetValue|0]#! of [Country.MakeScope.Var('mbga_candidate_count').GetValue|0]"
 mbga_dp_demand_provinces: "$war_goal_mbga_demand_provinces_type_name$"
 war_goal_mbga_demand_provinces_type_name: "Demand Provinces"
 war_goal_mbga_demand_provinces_type_desc: "Demand individual provinces of a [concept_state] instead of the whole thing."
 war_goal_mbga_demand_provinces: "Demand provinces in [WAR_GOAL_DRAFT.GetTargetState.GetCountry.GetFlagTextIcon] [WAR_GOAL_DRAFT.GetTargetState.GetName]"
 war_goal_mbga_demand_provinces_desc: "[WAR_GOAL_DRAFT.GetHolder.GetName] demands individual provinces of [WAR_GOAL_DRAFT.GetTargetState.GetName] from [WAR_GOAL_DRAFT.GetTarget.GetName]"

 MBGA_TAKEN_MARK: "@green_checkmark_box!"
 MBGA_ROW_CITY: "[Country.MakeScope.Var('mbga_active_state').GetState.GetCityHubName]"
 MBGA_ROW_PORT: "[Country.MakeScope.Var('mbga_active_state').GetState.GetPortHubName]"
 MBGA_ROW_FARM: "[Country.MakeScope.Var('mbga_active_state').GetState.GetFarmHubName]"
 MBGA_ROW_MINE: "[Country.MakeScope.Var('mbga_active_state').GetState.GetMineHubName]"
 MBGA_ROW_WOOD: "[Country.MakeScope.Var('mbga_active_state').GetState.GetForestryHubName]"
 MBGA_ROW_PLAIN: "[ScriptContainer.MakeScope.Var('mbga_province').GetProvince.GetTerrainName]"
 MBGA_MAP_FREE: "+"
 MBGA_MAP_TAKEN: "@green_checkmark_box!"
 MBGA_STATS_TOGGLE: "[SelectLocalization(GetScriptedGui('mbga_stats_shown').IsShown(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'MBGA_STATS_HIDE', 'MBGA_STATS_SHOW')]"
 MBGA_STATS_SHOW: "Numbers"
 MBGA_STATS_HIDE: "Hide numbers"

 rule_mbga_province_access: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Province Demands"
 setting_mbga_province_access_bordering: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_bordering_desc Bordering only#!#!"
 setting_mbga_province_access_bordering_desc: "A province can only be demanded where it touches land you already hold, so taking a state apart means working inwards from its edge."
 setting_mbga_province_access_anywhere: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_access_anywhere_desc #high Anywhere in the state#!#!#!"
 setting_mbga_province_access_anywhere_desc: "Any province of a state can be demanded regardless of where it lies. Faster, and it skips the work of finding out what borders what."

 rule_mbga_province_tool: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Province Transfer Tool"
 setting_mbga_province_tool_off: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_off_desc Off#!#!"
 setting_mbga_province_tool_off_desc: "No tool. Provinces change hands through war, as intended."
 setting_mbga_province_tool_diplomatic: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_diplomatic_desc #high Diplomatic action#!#!#!"
 setting_mbga_province_tool_diplomatic_desc: "Adds an action to the diplomacy screen. Pick a country, pick one of its states, then click the provinces you want on the map."
 setting_mbga_province_tool_debug: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_province_tool_debug_desc #high Debug panel#!#!#!"
 setting_mbga_province_tool_debug_desc: "The panel this mod was built through: country list, state list, province rows and counters. For working on the mod rather than playing with it."

 # This setting is for a mod that redraws the map and ships no table with it. On any map
 # the mod has a table for, nothing is ever scanned and none of these three do anything.
 rule_mbga_scan_budget: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! Province Scanning"
 setting_mbga_scan_budget_low: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_low_desc Short waits#!#!"
 setting_mbga_scan_budget_low_desc: "#high Has no effect on the base game's map.#!\n\nOnly small states are worked out the moment they open. Larger ones open at once and work themselves out as you click."
 setting_mbga_scan_budget_standard: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_standard_desc #high Balanced#!#!#!"
 setting_mbga_scan_budget_standard_desc: "#high Has no effect on the base game's map.#!\n\nMost states are worked out on opening; the largest are left to work themselves out as they are used."
 setting_mbga_scan_budget_high: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_scan_budget_high_desc #high Fewest interruptions#!#!#!"
 setting_mbga_scan_budget_high_desc: "#high Has no effect on the base game's map.#!\n\nNearly every state is worked out on opening, so clicking never stops to think. A large state can take a while to open."

 MBGA_ACTION_EFFECT_TT: "Opens the chosen state on the map, where you take its provinces one at a time. Nothing changes hands until you click one."
 rule_mbga_ai_demands: "#tooltip:[GetRawTextTooltipTag('mbga_tt')] @mbga_icon! #! AI Province Demands"
 setting_mbga_ai_demands_blocked: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_blocked_desc #high Players only#!#!#!"
 setting_mbga_ai_demands_blocked_desc: "Only you can demand provinces. An AI cannot draw a border by hand, so the war goal is not offered to it."
 setting_mbga_ai_demands_allowed: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mbga_ai_demands_allowed_desc AI may demand too#!#!"
 setting_mbga_ai_demands_allowed_desc: "An AI may take the war goal as well. It takes the provinces bordering its own land and works inwards, as far as its ruler is minded to, and pays for what it took."

 mbga_settlement.1.t: "The Border Commission"
 mbga_settlement.1.d: "The guns are quiet and [SCOPE.sState('mbga_settle_state').GetName] is ours to divide. In a room far from it, clerks unroll a map of the province and wait on your word: which valleys, which passes, which stretch of coast."
 mbga_settlement.1.f: "A war is won on the field and settled on paper. Every line you draw here will be somebody's border for a generation, and every one you leave crooked will be somebody's grievance."
 mbga_settlement.1.a: "Let us get to the drawing board!\n\n#red (Pause the game before you begin, to be sure nothing shifts under you.)#!"

 # The three throwaway countries are annexed away inside one effect chain and never seen, but
 # anything they touch keeps their name: a formation raised in a province while the courier
 # held it is still called after it. Named so that what is left over reads as flavour.
 MBG: "Occupation"
 MBG_ADJ: "Occupation"
 MBH: "Occupation"
 MBH_ADJ: "Occupation"
 MBT: "Conquest"
 MBT_ADJ: "Conquest"

 mbga_settlement.2.t: "Territory Annexed"
 mbga_settlement.2.d: "[SCOPE.sCountry('mbga_settle_winner').GetName] has annexed territory in [SCOPE.sState('mbga_settle_state').GetName]. Their surveyors were on the ground before the ink was dry, and the new line runs where they say it runs.\n\nThe seizure has cost them #v [SCOPE.sCountry('mbga_settle_winner').MakeScope.Var('mbga_settle_told').GetValue|1]#! [concept_infamy]."
 mbga_settlement.2.f: "Somewhere a clerk is redrawing a map, and somewhere else a family is finding out they woke up in another country."
 mbga_settlement.2.a: "We will not forget this."

 mbga_tt: "Added by Make Borders Great Again"
 mbga_take_provinces_action: "Take Provinces"
 mbga_take_provinces_action_desc: "Choose one of their states, then take the provinces you want from it directly on the map."
